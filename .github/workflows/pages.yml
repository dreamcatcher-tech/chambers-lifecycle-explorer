name: Publish Chambers Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact site source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify parser and source binding
        run: python3 -m unittest discover -s tests -v

      - name: Verify generated bundle is current
        run: python3 scripts/build_data.py --check --print-summary

      - name: Validate the publication artifact
        run: python3 scripts/validate_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the self-contained site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
